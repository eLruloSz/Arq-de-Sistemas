name: Backend CI

on:
  push:
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: django-insecure-ci-only
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DB_NAME: sistema_buses_test
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sistema_buses_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sistema_buses_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Check Django configuration
        run: python manage.py check

      - name: Check migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests with coverage
        run: |
          coverage erase
          coverage run manage.py test --noinput
          coverage report -m
          coverage report --fail-under=60
          coverage xml

  docker-smoke:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: django-insecure-ci-docker-only
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DB_NAME: sistema_buses_smoke
      DB_USER: postgres
      DB_PASSWORD: postgres
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate and smoke test Docker stack
        shell: bash
        run: |
          set -e
          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then
              docker compose logs backend || :
            fi
            docker compose down -v
            exit "$status"
          }
          trap cleanup EXIT

          docker compose config
          docker compose build backend
          docker compose up -d
          curl --fail --silent --show-error \
            --retry 20 --retry-delay 2 --retry-connrefused \
            http://localhost:8000/api/schema/ > /dev/null
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 2 --retry-connrefused \
            http://localhost:8000/api/docs/ > /dev/null
